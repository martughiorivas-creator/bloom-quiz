<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bloom · ¿Cuál es tu bloom?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quiz.css">
</head>
<body>

  <header class="top">
    <img class="logo" src="images/logo-bloom.png" alt="bloom">
    <span class="mini" id="counter"></span>
  </header>

  <div class="progress" aria-hidden="true"><i id="bar"></i></div>

  <main>

    <!-- Inicio -->
    <section id="start" class="screen is-active">
      <p class="mini">5 preguntas · 1 bloom</p>
      <h1 class="giant">¿Cuál es<br>tu bloom?</h1>
      <button class="pill" id="startBtn" type="button">Empezar</button>
    </section>

    <!-- Preguntas -->
    <section id="quiz" class="screen" aria-live="polite">
      <h2 class="question" id="question"></h2>
      <div class="answers" id="answers"></div>
    </section>

    <!-- Resultado -->
    <section id="result" class="screen result" aria-live="polite">
      <p class="mini">Tu bloom es</p>
      <div class="stage">
        <h2 class="bigword" id="winnerName" aria-hidden="true"></h2>
        <img class="bottle" id="winnerImg" alt="">
      </div>
      <p class="benefit" id="winnerBenefit"></p>
      <p class="why" id="winnerWhy"></p>
      <p class="mini ing" id="winnerIng"></p>

      <div class="match" id="match"></div>

      <p class="mini note">Lo ideal es en ayunas, pero no excluyente.<br>Tomalo cuando puedas, donde quieras.</p>
      <div class="actions">
        <a class="pill solid" href="https://www.instagram.com/shots.bloom/" target="_blank" rel="noopener">Pedí el tuyo</a>
        <button class="pill" id="again" type="button">Volver a jugar</button>
      </div>
    </section>

  </main>

  <script>
    // ---------- los tres bloom ----------
    const BLOOM = {
      naranja: { nombre: "Naranja", beneficio: "Inmunidad + energía", img: "images/naranja.png",
                 ingredientes: "Naranja, jengibre, limón, cúrcuma y pimienta negra",
                 porque: "Energía y defensas arriba. Un naranja y salís." },
      verde:   { nombre: "Verde", beneficio: "Detox + mineralización", img: "images/verde.png",
                 ingredientes: "Espinaca, apio, manzana verde, limón y spirulina",
                 porque: "Liviano y fresco desde temprano. Un verde y reseteás." },
      rojo:    { nombre: "Rojo", beneficio: "Circulación + rendimiento", img: "images/rojo.png",
                 ingredientes: "Remolacha, limón, zanahoria, jengibre, cúrcuma y pimienta",
                 porque: "Movimiento y ganas de rendir. Un rojo y a darle." }
    };

    // ---------- preguntas (cada respuesta suma a un bloom) ----------
    const PREGUNTAS = [
      { q: "¿Cómo arrancás?",
        a: [ ["Con el tiempo justo y corriendo", "naranja"],
             ["Lento, me cuesta prender", "verde"],
             ["Con ganas de moverme", "rojo"] ] },
      { q: "¿Qué tenés por delante?",
        a: [ ["Mil cosas: clases, reuniones, mandados", "naranja"],
             ["Algo tranqui, más de casa", "verde"],
             ["Entrenar o mucha calle", "rojo"] ] },
      { q: "¿Cómo fue la noche?",
        a: [ ["Dormí poco", "naranja"],
             ["Salí o comí pesado", "verde"],
             ["Cené bien y dormí bien", "rojo"] ] },
      { q: "¿Cómo sentís el cuerpo?",
        a: [ ["Con poca batería", "naranja"],
             ["Pesado, medio hinchado", "verde"],
             ["Con ganas de rendir", "rojo"] ] },
      { q: "¿Qué le pedís al día?",
        a: [ ["Que me alcance la energía", "naranja"],
             ["Sentirme liviano y fresco", "verde"],
             ["Rendir al máximo", "rojo"] ] }
    ];

    // ---------- helpers ----------
    const $ = (id) => document.getElementById(id);
    let paso = 0, puntos = {}, ultima = null, bloqueado = false;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));

    function show(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.remove("is-active"));
      $(id).classList.add("is-active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function setProgress(n) {
      $("bar").style.width = (n / PREGUNTAS.length) * 100 + "%";
      $("counter").textContent = n && n <= PREGUNTAS.length ? `0${n} / 0${PREGUNTAS.length}` : "";
    }

    function empezar() {
      paso = 0; ultima = null; bloqueado = false;
      puntos = { naranja: 0, verde: 0, rojo: 0 };
      pregunta();
      show("quiz");
    }

    function pregunta() {
      const p = PREGUNTAS[paso];
      setProgress(paso + 1);
      $("question").textContent = p.q;
      $("answers").innerHTML = "";
      p.a.forEach(([texto, key], i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "answer";
        b.style.animationDelay = i * 0.07 + "s";
        b.innerHTML = `<span>${texto}</span><em>→</em>`;
        b.addEventListener("click", () => responder(b, key));
        $("answers").appendChild(b);
      });
    }

    async function responder(btn, key) {
      if (bloqueado) return;
      bloqueado = true;
      puntos[key]++; ultima = key;
      btn.classList.add("picked");
      await wait(380);
      paso++;
      if (paso < PREGUNTAS.length) pregunta();
      else resultado();
      bloqueado = false;
    }

    function resultado() {
      // gana el que más puntos tenga; si hay empate, manda la última respuesta
      const orden = Object.keys(puntos).sort((a, b) => puntos[b] - puntos[a]);
      const maxP = puntos[orden[0]];
      const empatados = orden.filter((k) => puntos[k] === maxP);
      const gana = empatados.length > 1 && empatados.includes(ultima) ? ultima : empatados[0];
      const f = BLOOM[gana];

      setProgress(PREGUNTAS.length);
      $("counter").textContent = "";
      $("winnerImg").src = f.img;
      $("winnerImg").alt = `Shot ${f.nombre.toLowerCase()} de bloom`;
      $("winnerName").textContent = f.nombre;
      $("winnerBenefit").textContent = f.beneficio;
      $("winnerWhy").textContent = f.porque;
      $("winnerIng").textContent = f.ingredientes;

      $("match").innerHTML = ["naranja", "verde", "rojo"].map((k) => {
        const pct = Math.round((puntos[k] / PREGUNTAS.length) * 100);
        return `<div class="m-row"><span>${BLOOM[k].nombre}</span><div class="m-bar"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>`;
      }).join("");

      show("result");
    }

    $("startBtn").addEventListener("click", empezar);
    $("again").addEventListener("click", () => { setProgress(0); show("start"); });
  </script>
</body>
</html>
